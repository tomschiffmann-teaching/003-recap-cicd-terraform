name: CD

# Läuft bei jedem Push auf main (= nach jedem gemergten Pull Request)
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nie zwei Deployments gleichzeitig – das zweite wartet
concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  TF_VAR_vorname: ${{ vars.VORNAME }}
  TF_IN_AUTOMATION: "true"

jobs:
  # -------------------------------------------------------------
  # 1. Infrastruktur mit Terraform ausrollen (ECR, IAM, VPC, EC2)
  # -------------------------------------------------------------
  infrastruktur:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abschlussprojekt/infra
    # Werte, die die folgenden Jobs brauchen
    outputs:
      ecr_url: ${{ steps.werte.outputs.ecr_url }}
      instance_id: ${{ steps.werte.outputs.instance_id }}
      webapp_url: ${{ steps.werte.outputs.webapp_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Terraform installieren
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      # Der Plan wurde schon im Pull Request geprüft – hier wird ausgerollt
      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Terraform-Outputs an die nächsten Jobs weitergeben
        id: werte
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw instance_id)"    >> "$GITHUB_OUTPUT"
          echo "webapp_url=$(terraform output -raw webapp_url)"      >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------
  # 2. Docker-Image bauen und nach ECR pushen
  # -------------------------------------------------------------
  build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: infrastruktur
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      ECR_URL: ${{ needs.infrastruktur.outputs.ecr_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      # Registry = alles vor dem ersten "/" der Repository-URL
      - name: Bei ECR anmelden
        run: |
          REGISTRY="${ECR_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Image bauen
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t "$ECR_URL:${{ github.sha }}" \
            -t "$ECR_URL:latest" \
            abschlussprojekt/app

      - name: Image pushen
        id: push
        run: |
          docker push "$ECR_URL:${{ github.sha }}"
          docker push "$ECR_URL:latest"
          echo "image=$ECR_URL:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------
  # 3. Das neue Image auf der EC2-Instanz starten (über SSM)
  # -------------------------------------------------------------
  deploy-ec2:
    name: Deploy auf EC2
    runs-on: ubuntu-latest
    needs: [infrastruktur, build-push]
    env:
      INSTANCE_ID: ${{ needs.infrastruktur.outputs.instance_id }}
      IMAGE: ${{ needs.build-push.outputs.image }}
      WEBAPP_URL: ${{ needs.infrastruktur.outputs.webapp_url }}
    steps:
      # Nach dem ersten Start braucht die Instanz 1–3 Minuten, bis der SSM-Agent sich meldet
      - name: Warten, bis die Instanz bei SSM erreichbar ist
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text)
            echo "Versuch $i: $STATUS"
            if [ "$STATUS" = "Online" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Instanz $INSTANCE_ID ist nicht bei SSM angekommen"
          exit 1

      - name: Container auf der Instanz austauschen
        run: |
          REGISTRY="${IMAGE%%/*}"

          # Diese Befehle laufen als root AUF DER EC2-INSTANZ
          BEFEHLE=$(jq -n --arg image "$IMAGE" --arg registry "$REGISTRY" '{commands: [
            "set -e",
            "cloud-init status --wait > /dev/null || true",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \($registry)",
            "docker pull \($image)",
            "docker rm -f webapp || true",
            "docker run -d --name webapp --restart unless-stopped -p 80:3000 -e PLATTFORM=EC2 \($image)",
            "docker image prune -af",
            "docker ps"
          ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "$BEFEHLE" \
            --query "Command.CommandId" --output text)
          echo "SSM-Befehl: $COMMAND_ID"

          # Auf das Ergebnis warten
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "----- Ausgabe auf der Instanz -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text

          [ "$STATUS" = "Success" ]

      - name: Smoke-Test – läuft die neue Version?
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent "$WEBAPP_URL/health" | grep -q "${{ github.sha }}"; then
              echo "✅ Version ${{ github.sha }} läuft: $WEBAPP_URL"
              echo "### 🚀 Web-App läuft auf EC2: $WEBAPP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$WEBAPP_URL liefert nicht die Version ${{ github.sha }}"
          exit 1
